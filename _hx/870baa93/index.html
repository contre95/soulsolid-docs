<div class="relative bg-white/30 hover:bg-white/60 dark:bg-gray-900/30 dark:hover:bg-gray-900/60 transition-colors border border-gray-200/60 dark:border-gray-800/70 rounded-2xl shadow-lg p-6 mb-8">
 
  <div class="flex flex-col md:flex-row md:items-start gap-6 md:gap-8">
    
    <div class="w-full md:w-1/3">
      <div class="flex items-center gap-4">
        
          <img src="/img/user_demo.jpg" alt="Profile Picture" class="w-16 h-16 rounded-full">
        

        <div class="flex-1">
          <h2 class="text-xl font-semibold text-slate-800 dark:text-white mb-1">Demo User</h2>
          <div class="flex items-center gap-2 mb-3">
            <p class="text-slate-600 dark:text-slate-400">Dummy</p>
          </div>

          <div class="flex items-center gap-3 flex-wrap">
            
            
            <span class="group inline-flex items-center px-2 py-1 rounded-md text-xs font-medium tracking-wider transition-all duration-300 ease-out-expo hover:-translate-y-0.5
              bg-green-500/10 backdrop-blur-md border border-green-400/30 text-green-600 dark:text-green-300 shadow-lg shadow-green-500/10 hover:shadow-green-500/20
              ">
              <span class="flex items-center">
                <i class="fas fa-check-circle mr-2 opacity-80"></i>
                <span class="font-semibold uppercase">dummy</span>
              </span>
            </span>
            
          </div>
        </div>
      </div>
    </div>

    
    <div class="w-full md:w-3/4 flex flex-col">
      <h3 class="text-lg font-semibold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-slate-600 dark:text-slate-300">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 10.607 10.607Z" />
        </svg>
        Search Music
        <div id="search-spinner" class="htmx-indicator opacity-0 transition-opacity duration-200">
          <img src="/img/spinner.png" class="w-5 h-5 opacity-80 animate-spin" alt="Loading...">
        </div>
      </h3>

      
      <form class="flex flex-col h-full space-y-3" hx-post="/downloads/search" hx-target="#search-results" hx-swap="innerHTML" hx-indicator="#search-spinner" hx-on:htmx:before-request="document.getElementById('homepage-content').style.display = 'none'" hx-on:htmx:after-request="document.getElementById('search-results').style.display = 'block'">
        <div class="flex flex-col lg:flex-row gap-2 flex-1">
          <input
            type="text"
            name="query"
            placeholder="Search for albums, artists, tracks..."
            class="flex-1 bg-white/60 dark:bg-gray-700/60 border border-gray-300/50 dark:border-gray-600/50 text-gray-900 dark:text-white text-sm rounded-full focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 px-4 py-2.5 dark:placeholder-gray-400 backdrop-blur-sm"
          required>
            <select name="type" class="bg-white/60 dark:bg-gray-700/60 border border-gray-300/50 dark:border-gray-600/50 text-gray-900 dark:text-white text-sm rounded-xl focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 px-3 py-2.5 dark:placeholder-gray-400 backdrop-blur-sm sm:flex-shrink-0">
              
              <option value="track">Tracks</option>
              <option value="album">Albums</option>
              
              
              
              <option value="link">Link</option>
              
            </select>
           <input type="hidden" name="downloader" value="dummy">
        </div>
        <button
          type="submit"
          hx-indicator="#search-indicator"
          class="text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-4 py-2.5 text-center dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-800 flex items-center justify-center gap-2 relative">
          <div id="search-indicator" class="absolute inset-0 flex items-center justify-center opacity-0">
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin opacity-90"></div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 relative z-10">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 10.607 10.607Z" />
          </svg>
          <span class="relative z-10">Search</span>
        </button>
      </form>
    </div>
  </div>

</div>
