<div hx-swap-oob="beforeend:#toast-container"><div id="toastInfo" class="p-4 rounded-lg shadow-lg border backdrop-blur-sm max-w-sm bg-blue-50/90 dark:bg-blue-900/80 border-blue-200 dark:border-blue-700 text-blue-800 dark:text-blue-200 animate__animated animate__bounceInRight" _="on load wait 4s then add .animate__bounceOutRight then wait 1s then remove me">
  <div class="flex items-center">
    <div class="flex-shrink-0">
      <svg class="h-5 w-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
      </svg>
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium">Found 1 genre group to review</p>
    </div>
    <div class="ml-auto pl-3">
      <button _="on click toggle .animate__bounceOutRight on #toastInfo then toggle .animate__bounceInRight on #toastInfo then wait 1s then remove #toastInfo" class="inline-flex rounded-md p-1.5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors">
        <span class="sr-only">Dismiss</span>
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
</div>

<div class="space-y-4">
    
    <form id="merge-genre-card-0" hx-post="/merge/genres" hx-swap="none"
          class="border border-gray-200/70 dark:border-gray-700/70 rounded-xl p-3 bg-white/40 dark:bg-gray-800/40">
        <input type="hidden" name="card_id" value="merge-genre-card-0">
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-500 dark:text-gray-400">2 variants</span>
            <span class="text-[10px] uppercase tracking-wide text-gray-400">keep</span>
        </div>
        <div class="space-y-1.5">
            
            <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-200 cursor-pointer">
                <input type="checkbox" name="members" value="Hip Hop" checked
                       class="rounded border-gray-300 dark:border-gray-600 text-green-500 focus:ring-green-500">
                <span class="flex-1 truncate" title="Hip Hop">Hip Hop</span>
                <input type="radio" name="canonical" value="Hip Hop" checked
                       class="text-green-500 focus:ring-green-500" title="Keep this genre">
            </label>
            
            <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-200 cursor-pointer">
                <input type="checkbox" name="members" value="Hip-Hop" checked
                       class="rounded border-gray-300 dark:border-gray-600 text-green-500 focus:ring-green-500">
                <span class="flex-1 truncate" title="Hip-Hop">Hip-Hop</span>
                <input type="radio" name="canonical" value="Hip-Hop" 
                       class="text-green-500 focus:ring-green-500" title="Keep this genre">
            </label>
            
        </div>
        <button type="submit"
                class="mt-3 w-full border border-green-500 dark:border-green-400 text-green-600 dark:text-green-300 hover:bg-green-50 dark:hover:bg-green-900/30 text-sm font-medium py-1.5 px-3 rounded-md transition-colors">
            Merge
        </button>
    </form>
    
</div>
