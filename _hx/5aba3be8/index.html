
      
      <button type="button" title="Click to switch between move and copy"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "true", "import.always_queue": "false", "import.duplicates": "queue"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="group inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 bg-blue-500/10 backdrop-blur-md border border-blue-400/30 text-blue-600 dark:text-blue-300 shadow-lg shadow-blue-500/10 hover:shadow-blue-500/20">
        <span class="flex items-center">
          <span class="font-semibold">COPY</span>
        </span>
      </button>

      
      <button type="button" title="Click to turn always queue on" aria-pressed="false"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "false", "import.always_queue": "true", "import.duplicates": "queue"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 bg-gray-500/10 backdrop-blur-md border border-gray-400/30 text-gray-500 dark:text-gray-400 opacity-70 hover:opacity-100">
        <span class="flex items-center">
          <span class="font-semibold line-through">ALWAYS QUEUE</span>
        </span>
      </button>

      
      <button type="button" title="Click to cycle duplicate handling (replace, skip, queue)"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "false", "import.always_queue": "false", "import.duplicates": "replace"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="group inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 bg-violet-500/10 backdrop-blur-md border border-violet-400/30 text-violet-600 dark:text-violet-300 shadow-lg shadow-violet-500/10 hover:shadow-violet-500/20">
        <span class="flex items-center">
          <span class="uppercase tracking-tight font-normal opacity-90 group-hover:opacity-100 transition-opacity">DUP. queue</span>
        </span>
      </button>
