
<div id="metadataChart" style="width: 100%; height: 100%"></div>
<script>
  (function() {
    
    const roundedData = [51.11111111111111,51.11111111111111,97.77777777777777,95.55555555555556,15.555555555555555,0,100].map(val => parseFloat(val.toFixed(2)));

    const options = {
      series: [{
        name: 'Metadata',
        data: roundedData
      }],
      chart: {
        type: 'bar',
        height: '100%',
        toolbar: {
          show: false
        }
      },
      colors: ["#00E396","#FEB019","#FF4560","#008FFB","#775DD0","#00D9FF","#FF6B6B"],
      plotOptions: {
        bar: {
          borderRadius: 2,
          horizontal: true,
          distributed: true,
          dataLabels: {
            enabled: true,
            position: 'center',
            formatter: function (val) {
              return val + "%";
            },
            style: {
              colors: ['#6E6E6E'],
              fontSize: '12px'
            }
          }
        }
      },
      xaxis: {
        categories: ["ISRC","BPM","Year","Genre","Lyrics","AcoustID","Fingerprint"],
        title: {
          text: 'Completeness',
          style: {
            color: '#6E6E6E'
          }
        },
        labels: {
          style: {
            colors: '#6E6E6E'
          },
          formatter: function (val) {
            return val
          }
        }
      },
      yaxis: {
        title: {
          text: '',
          style: {
            color: '#6E6E6E'
          }
        },
        labels: {
          style: {
            colors: '#6E6E6E'
          }
        }
      },
      legend: {
        show: false
      },
      fill: {
        opacity: 1
      },
      tooltip: {
        theme: 'light',
        y: {
          formatter: function (val) {
            return val.toFixed(2) + "%"
          }
        }
      }
    };

    new ApexCharts(document.getElementById('metadataChart'), options).render();
  })();
</script>
